[package]
name = "wave_engine"
version = "0.1.1"
edition = "2021"
authors = ["Nami Reghbati"]

[dependencies]
wave-core = {path = "dep/wave-core", features = ["debug", "vulkan"]}
wave-editor = {path = "src/wave_editor"}

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
